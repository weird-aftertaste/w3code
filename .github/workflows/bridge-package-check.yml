name: OMP bridge package checks

on:
  push:
    branches:
      - omp-bridge-standalone
  pull_request:
    branches:
      - omp-bridge-standalone

permissions:
  contents: read

jobs:
  test-and-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run --json
